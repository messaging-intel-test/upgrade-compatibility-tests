name: vector projection upgrade admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vector-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Prove 4100 exact storage and 4000 ANN projection compatibility
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const pad4100 = values => {
            if (values.length > 4096) throw new Error('source_dimension_overflow');
            return [...values, ...Array(4100 - values.length).fill(0)];
          };
          const project4000 = exact => {
            if (exact.length !== 4100) throw new Error('exact_dimension_mismatch');
            return exact.slice(0, 4000);
          };
          const source = Array.from({length: 4096}, (_, i) => (i + 1) / 10000);
          const exact = pad4100(source);
          assert.equal(exact.length, 4100);
          assert.deepEqual(exact.slice(0, 4096), source);
          assert.deepEqual(exact.slice(4096), [0,0,0,0]);
          const ann = project4000(exact);
          assert.equal(ann.length, 4000);
          assert.deepEqual(ann, source.slice(0, 4000));
          const rows = new Map();
          const reconcile = (id, vector) => rows.set(id, project4000(vector));
          reconcile('embedding-1', exact);
          reconcile('embedding-1', exact);
          assert.equal(rows.size, 1, 'reconciliation must be idempotent by embedding id');
          assert.throws(() => pad4100(Array(4097).fill(1)), /source_dimension_overflow/);
          NODE